name: Deploy Vite site to S3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::271995868497:role/TrustPolicy_cadendengel
          aws-region: us-east-2

      # Only Vite's hashed files in assets/ are safe to cache forever. Files with fixed
      # names (resume PDF, images, favicon) get a short cache so updates show up.
      - name: Deploy hashed build assets to S3
        run: aws s3 sync dist/assets s3://cadendengel/assets --cache-control "public,max-age=31536000,immutable"

      - name: Deploy other static files to S3
        run: aws s3 sync dist/ s3://cadendengel/ --exclude "assets/*" --exclude "index.html" --cache-control "public,max-age=3600"

      - name: Deploy index.html with no-cache headers
        run: aws s3 cp dist/index.html s3://cadendengel/index.html --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"

      # Clear CloudFront's cache so updated images and the resume show up right away.
      # A "/*" wildcard counts as one path toward the 1,000 free invalidation paths per month.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EEFOQLPBESWP --paths "/*"

  deploy-counter-proxy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::271995868497:role/TrustPolicy_cadendengel
          aws-region: us-east-2

      - name: Build counter proxy
        run: sam build -t infrastructure/counter-proxy/template.yaml

      - name: Deploy counter proxy stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cadendengel-counter-proxy \
            --s3-bucket cadendengel \
            --s3-prefix sam-artifacts/counter-proxy \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides AllowedOrigin=https://cadendengel.com \
            --region us-east-2 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset